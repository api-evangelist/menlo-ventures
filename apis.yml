aid: menlo-ventures
name: Menlo Ventures
description: >-
  Menlo Ventures is an early-stage venture capital firm founded in 1976 and
  headquartered in Menlo Park and San Francisco, California, that invests in
  transformative technology companies across the full early lifecycle. Its
  strategy spans "the Three Stages of Early" — Inception (validating early ideas,
  including via the Inception Fund and the Anthology Fund AI accelerator built
  with Anthropic), Venture (Series A/B), and Inflection (early growth). Menlo
  invests across artificial intelligence, bio and healthcare, consumer,
  cybersecurity, defense, fintech, infrastructure, robotics and hardware, SaaS,
  and supply chain and automation, primarily in North America. Over roughly five
  decades the firm reports backing companies that produced 85+ public companies
  and 170+ mergers and acquisitions, with a portfolio that includes Anthropic,
  Uber, Roku, Chime, Carta, Benchling, Pinecone, Netlify, and Warby Parker. In
  2026 Menlo announced $3 billion in fresh capital, the largest raise in the
  firm's history, and reports $7.6B+ in assets under management. Its ethos is
  "when we invest, we're invested" — active, hands-on support beyond capital.
